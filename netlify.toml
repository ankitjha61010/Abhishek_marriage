[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache hashed JS/CSS and the music for a long time; always re-check the page itself
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Kudmayi.mp3"
  [headers.values]
    Cache-Control = "public, max-age=604800"
